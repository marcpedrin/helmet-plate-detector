name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-core.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-core.txt -r requirements-dev.txt
      - name: Ruff (incl. docstring rules)
        run: ruff check .
      - name: No ML imports at module top level
        run: |
          if grep -rnE '^(import|from) (torch|ultralytics|rapidocr|open_image_models|onnxruntime)\b' app; then
            echo "::error::Top-level ML import found (see CONTRIBUTING.md)"; exit 1
          fi
      - name: Pytest
        run: pytest -m "not model" -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Module docs (strict on main and on ready PRs)
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.pull_request.draft }}" = "false" ]; then
            python scripts/check_docs.py --strict
          else
            python scripts/check_docs.py
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
