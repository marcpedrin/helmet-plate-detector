# ByteTrack config for the pipeline (owner: Marc). Keys match ultralytics 8.4.x cfg/trackers/bytetrack.yaml.
# Tuned for PIPELINE_FPS ~5 (see docs/adr/0004-marc-bytetrack-tracker.md).
tracker_type: bytetrack
# WHY: 0.4 (default 0.25) keeps first-stage matches to confident boxes; weak boxes still rescue tracks in stage 2.
track_high_thresh: 0.4
track_low_thresh: 0.1
# WHY: 0.45 (default 0.25) avoids spawning tracks from one-frame false positives, which would start votes.
new_track_thresh: 0.45
# WHY: 15 frames ~= 3 s at 5 FPS (default 30 assumes 30 FPS ~= 1 s); riders occluded by buses keep their id.
track_buffer: 15
match_thresh: 0.8
fuse_score: true
